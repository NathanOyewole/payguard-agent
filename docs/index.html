<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PayGuard Agent</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #0f172a; color: #e2e8f0; }
    h1 { color: #38bdf8; }
    .chat { background: #1e293b; border-radius: 12px; padding: 20px; min-height: 300px; margin-bottom: 20px; }
    .msg { margin: 10px 0; padding: 10px 14px; border-radius: 8px; }
    .user { background: #334155; text-align: right; }
    .agent { background: #1e3a5f; }
    .risk-low { border-left: 4px solid #22c55e; }
    .risk-medium { border-left: 4px solid #eab308; }
    .risk-high { border-left: 4px solid #ef4444; }
    input { width: 70%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; }
    button { padding: 10px 20px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; cursor: pointer; font-weight: bold; }
    button:hover { background: #0ea5e9; }
  </style>
</head>
<body>
  <h1>🛡️ PayGuard Agent</h1>
  <p>AI-powered fraud-aware payment agent. Type a payment request in natural language.</p>
  <div class="chat" id="chat"></div>
  <div>
    <input id="input" placeholder='e.g. "Send $200 to vendor@example.com for invoice #42"' />
    <button onclick="send()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.innerHTML = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';

      // Parse intent
      const parseResp = await fetch('/api/parse-intent', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text})
      });
      const intent = await parseResp.json();

      // Analyze fraud
      const analyzeResp = await fetch('/api/analyze', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(intent)
      });
      const fraud = await analyzeResp.json();

      const riskCls = fraud.risk_level === 'low' ? 'risk-low' : fraud.risk_level === 'medium' ? 'risk-medium' : 'risk-high';
      let msg = `<strong>Risk: ${fraud.risk_level.toUpperCase()} (${fraud.risk_score}/100)</strong><br>${fraud.explanation}<br><em>Recommendation: ${fraud.recommendation}</em>`;

      if (fraud.recommendation === 'approve') {
        // Execute
        const execResp = await fetch('/api/execute', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({...intent, confirmed: true})
        });
        const result = await execResp.json();
        if (result.status === 'executed') {
          msg += `<br><br>✅ Payment executed! Order ID: ${result.order.id}`;
        }
      } else if (fraud.recommendation === 'review') {
        msg += `<br><br>⚠️ Requires confirmation. Click "Confirm" to proceed.`;
      } else {
        msg += `<br><br>🚫 Payment blocked.`;
      }

      addMsg(msg, 'agent ' + riskCls);
    }

    input.addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
